name: Android build

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publish the APK as a GitHub pre-release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # test builds share one committed debug key, so a new pre-release installs
      # over the previous one; this key is not for Play Store releases
      - name: Use the shared test signing key
        run: |
          mkdir -p ~/.android
          cp android/ci-debug.keystore ~/.android/debug.keystore

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test

      - name: Build APK
        run: ./gradlew --no-daemon :android:assembleDebug

      - name: Name the APK
        id: apk
        run: |
          version=$(grep -oP "appVersionName = '\K[^']+" build.gradle)
          tag="v${version}-anki.${GITHUB_RUN_NUMBER}"
          mkdir -p out
          cp android/build/outputs/apk/debug/android-debug.apk "out/AnkiDungeon-${tag}.apk"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: AnkiDungeon-${{ steps.apk.outputs.tag }}
          path: out/*.apk

      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.prerelease
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Test build ${{ steps.apk.outputs.tag }}
          prerelease: true
          files: out/*.apk
          body: |
            Test build from ${{ github.sha }}. Not for general use yet.

            - Needs AnkiDroid with at least one deck; the game asks for access on the first card.
            - Signed with a shared test key: it installs over earlier test builds, but not over a Play Store version.
            - Based on Shattered Pixel Dungeon (GPLv3); source is this repository.
