<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
@font-face {
    font-family: "GamePixel";
    src: url("file:///android_asset/fonts/pixel_font.ttf");
}

:root {
    --stone: #3e4039;
    --stone-dark: #2b2c27;
    --stone-light: #7b8073;
    --ink: #f0ece0;
    --muted: #a0a695;
    --title: #ffff44;
    --good: #7fd36a;
    --bad: #e05a4a;
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

#overlay {
    box-sizing: border-box;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
}

/* the game's window chrome, scaled 3x without smoothing */
#panel {
    box-sizing: border-box;
    width: 100%;
    max-width: 720px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    border-style: solid;
    border-width: 18px;
    border-image: url("frame.png") 6 fill / 18px stretch;
    image-rendering: pixelated;
    font-family: "GamePixel", monospace;
}

#head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: -6px 0 8px;
}

#title {
    color: var(--title);
    font-size: 20px;
    white-space: nowrap;
}

#clock {
    flex: 1;
    height: 10px;
    background: var(--stone-dark);
    border: 3px solid var(--stone-light);
    image-rendering: pixelated;
}

#clock-fill {
    height: 100%;
    width: 100%;
    background: var(--good);
}

#content {
    flex: 1 1 auto;
    overflow-y: auto;
    min-height: 60px;
    padding: 12px 10px;
    background: var(--stone-dark);
    border: 3px solid #1d1e1a;
    font-family: sans-serif;
}

#answer {
    display: none;
}

#foot {
    margin-top: 10px;
}

#buttons {
    display: flex;
    gap: 8px;
}

/* the game's red button chrome (Chrome.Type.RED_BUTTON) */
.btn {
    flex: 1;
    min-height: 48px;
    padding: 6px 4px;
    color: var(--ink);
    font-family: "GamePixel", monospace;
    font-size: 18px;
    background: none;
    border-style: solid;
    border-width: 6px;
    border-image: url("button.png") 2 fill / 6px stretch;
    image-rendering: pixelated;
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
}

.btn:active {
    filter: brightness(1.3);
}

.btn small {
    display: block;
    font-size: 12px;
    color: #ffd9c8;
}

#honesty {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
}

#status {
    color: var(--bad);
}

.missing-media {
    color: var(--muted);
    font-size: 12px;
}
</style>
<style>
%%CSS%%
</style>
<style>
/* keep the deck's fonts and layout, but sit on the game's dark panel */
.card {
    background: transparent !important;
    color: var(--ink) !important;
}
</style>
</head>
<body class="card nightMode night_mode">
<div id="overlay">
    <div id="panel">
        <div id="head">
            <span id="title"></span>
            <div id="clock"><div id="clock-fill"></div></div>
        </div>
        <div id="content">
            <div id="question" class="card">%%QUESTION%%</div>
            <div id="answer" class="card">%%ANSWER%%</div>
        </div>
        <div id="foot">
            <div id="buttons"></div>
            <div id="honesty">Thou shalt answer honestly &mdash; or else just play the normal game.</div>
        </div>
    </div>
</div>
<script>
var CONFIG = %%CONFIG%%;
var revealed = false;

function el(id) { return document.getElementById(id); }

function button(label, sub, onClick) {
    var b = document.createElement("button");
    b.className = "btn";
    b.textContent = label;
    if (sub) {
        var s = document.createElement("small");
        s.textContent = sub;
        b.appendChild(s);
    }
    b.addEventListener("click", onClick);
    return b;
}

function setButtons(list) {
    var box = el("buttons");
    box.innerHTML = "";
    list.forEach(function (b) { box.appendChild(b); });
}

function freezeClock() {
    var fill = el("clock-fill");
    var w = getComputedStyle(fill).width;
    fill.style.transition = "none";
    fill.style.width = w;
}

function showAnswer() {
    revealed = true;
    freezeClock();
    el("question").style.display = "none";
    el("answer").style.display = "block";
    el("content").scrollTop = 0;
}

function grade(ease) {
    setButtons([]);
    AnkiBridge.grade(ease);
}

function gradeButtons() {
    if (CONFIG.simple) {
        setButtons([
            button("Again", "I missed it", function () { grade(1); }),
            button("Good", "I knew it", function () { grade(3); })
        ]);
    } else {
        setButtons([
            button("Again", null, function () { grade(1); }),
            button("Hard", null, function () { grade(2); }),
            button("Good", null, function () { grade(3); }),
            button("Easy", null, function () { grade(4); })
        ]);
    }
}

function reveal() {
    if (revealed) {
        return;
    }
    AnkiBridge.reveal();
    showAnswer();
    gradeButtons();
}

// called by the game when the thinking time runs out
function timeUp() {
    if (revealed) {
        return;
    }
    showAnswer();
    var title = el("title");
    title.id = "status";
    title.textContent = "Time's up!";
    setButtons([button("Continue", "counts as Again", function () { grade(1); })]);
}

(function init() {
    el("title").textContent = CONFIG.title;

    // AnkiDroid's media folder isn't reachable from here
    Array.prototype.forEach.call(document.querySelectorAll("img"), function (img) {
        img.addEventListener("error", function () {
            var note = document.createElement("span");
            note.className = "missing-media";
            note.textContent = "[image]";
            img.replaceWith(note);
        });
    });

    var fill = el("clock-fill");
    requestAnimationFrame(function () {
        requestAnimationFrame(function () {
            fill.style.transition = "width " + CONFIG.thinkMs + "ms linear, background-color " + CONFIG.thinkMs + "ms linear";
            fill.style.width = "0%";
            fill.style.backgroundColor = "#e05a4a";
        });
    });

    setButtons([button("Show answer", null, reveal)]);
    el("content").addEventListener("click", reveal);
})();
</script>
</body>
</html>
