<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
@font-face {
    font-family: "GamePixel";
    src: url("file:///android_asset/fonts/pixel_font.ttf");
}

:root {
    --stone: #3e4039;
    --stone-dark: #2b2c27;
    --stone-light: #7b8073;
    --ink: #f0ece0;
    --muted: #a0a695;
    --title: #ffff44;
    --good: #7fd36a;
    --bad: #e05a4a;
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

#overlay {
    box-sizing: border-box;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
}

/* the game's window chrome, scaled 3x without smoothing */
#panel {
    box-sizing: border-box;
    width: 100%;
    max-width: 720px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    border-style: solid;
    border-width: 18px;
    border-image: url("frame.png") 6 fill / 18px stretch;
    image-rendering: pixelated;
    font-family: "GamePixel", monospace;
}

#head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: -6px 0 8px;
}

#title {
    color: var(--title);
    font-size: 20px;
    white-space: nowrap;
}

#title.bad {
    color: var(--bad);
}

#clock {
    flex: 1;
    height: 10px;
    background: var(--stone-dark);
    border: 3px solid var(--stone-light);
    image-rendering: pixelated;
}

#clock-fill {
    height: 100%;
    width: 100%;
    background: var(--good);
}

/* back / bury / suspend: kept away from the answer buttons on purpose */
#tools {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}

#content {
    flex: 1 1 auto;
    overflow-y: auto;
    min-height: 60px;
    padding: 12px 10px;
    background: var(--stone-dark);
    border: 3px solid #1d1e1a;
    font-family: sans-serif;
}

#answer {
    display: none;
}

#note {
    display: none;
    margin-top: 8px;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
}

#foot {
    margin-top: 10px;
}

#buttons {
    display: flex;
    gap: 8px;
}

/* the game's red button chrome (Chrome.Type.RED_BUTTON) */
.btn {
    flex: 1;
    min-height: 48px;
    padding: 6px 4px;
    color: var(--ink);
    font-family: "GamePixel", monospace;
    font-size: 18px;
    background: none;
    border-style: solid;
    border-width: 6px;
    border-image: url("button.png") 2 fill / 6px stretch;
    image-rendering: pixelated;
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
    transition: opacity 0.15s;
}

/* the game's grey button chrome (Chrome.Type.GREY_BUTTON) */
.btn.grey {
    min-height: 36px;
    font-size: 15px;
    border-image: url("button_grey.png") 2 fill / 6px stretch;
}

.btn:active {
    filter: brightness(1.3);
}

.btn small {
    display: block;
    font-size: 12px;
    color: #ffd9c8;
}

/* not usable right now (wrong side, nothing to undo, ...) */
.btn:disabled {
    opacity: 0.35;
    filter: grayscale(1);
}

/* briefly locked after the card changes, against accidental taps */
.locked .btn {
    opacity: 0.45;
    pointer-events: none;
}

#honesty {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
}

.missing-media {
    color: var(--muted);
    font-size: 12px;
}
</style>
<style>
%%CSS%%
</style>
<style>
/* keep the deck's fonts and layout, but sit on the game's dark panel */
.card {
    background: transparent !important;
    color: var(--ink) !important;
}
</style>
</head>
<body class="card nightMode night_mode">
<div id="overlay">
    <div id="panel">
        <div id="head">
            <span id="title"></span>
            <div id="clock"><div id="clock-fill"></div></div>
        </div>
        <div id="tools">
            <button class="btn grey" id="btn-back">Back</button>
            <button class="btn grey" id="btn-bury">Bury</button>
            <button class="btn grey" id="btn-suspend">Suspend</button>
        </div>
        <div id="content">
            <div id="question" class="card">%%QUESTION%%</div>
            <div id="answer" class="card">%%ANSWER%%</div>
        </div>
        <div id="note"></div>
        <div id="foot">
            <div id="buttons"></div>
            <div id="honesty">Thou shalt answer honestly &mdash; or else just play the normal game.</div>
        </div>
    </div>
</div>
<script>
var CONFIG = %%CONFIG%%;

// how long buttons ignore taps after the card changes
var LOCK_MS = 600;

var revealed = false;
var timedOut = false;
var lockTimer = null;

function el(id) { return document.getElementById(id); }

function lock() {
    var panel = el("panel");
    panel.classList.add("locked");
    clearTimeout(lockTimer);
    lockTimer = setTimeout(function () { panel.classList.remove("locked"); }, LOCK_MS);
}

function isLocked() {
    return el("panel").classList.contains("locked");
}

function button(label, sub, onClick) {
    var b = document.createElement("button");
    b.className = "btn";
    b.textContent = label;
    if (sub) {
        var s = document.createElement("small");
        s.textContent = sub;
        b.appendChild(s);
    }
    b.addEventListener("click", function () {
        if (!isLocked()) {
            onClick();
        }
    });
    return b;
}

function setButtons(list) {
    var box = el("buttons");
    box.innerHTML = "";
    list.forEach(function (b) { box.appendChild(b); });
}

function updateTools() {
    // back: answer side -> question; question side -> undo the last bury/suspend
    el("btn-back").disabled = timedOut || (!revealed && !CONFIG.canUndo);
    el("btn-bury").disabled = timedOut;
    el("btn-suspend").disabled = timedOut;
}

function note(text) {
    var n = el("note");
    n.textContent = text || "";
    n.style.display = text ? "block" : "none";
}

/* clock: drains from (limit - elapsed) to 0 */
function runClock(elapsedMs) {
    var fill = el("clock-fill");
    var left = Math.max(0, CONFIG.thinkMs - elapsedMs);
    var frac = left / CONFIG.thinkMs;
    fill.style.transition = "none";
    fill.style.width = (frac * 100) + "%";
    fill.style.backgroundColor = frac > 0.5 ? "#7fd36a" : "#e0a84a";
    fill.offsetWidth; // apply the start state before animating
    fill.style.transition = "width " + left + "ms linear, background-color " + left + "ms linear";
    fill.style.width = "0%";
    fill.style.backgroundColor = "#e05a4a";
}

function freezeClock() {
    var fill = el("clock-fill");
    var w = getComputedStyle(fill).width;
    var c = getComputedStyle(fill).backgroundColor;
    fill.style.transition = "none";
    fill.style.width = w;
    fill.style.backgroundColor = c;
}

function gradeButtons() {
    if (CONFIG.simple) {
        setButtons([
            button("Again", "I missed it", function () { grade(1); }),
            button("Good", "I knew it", function () { grade(3); })
        ]);
    } else {
        setButtons([
            button("Again", null, function () { grade(1); }),
            button("Hard", null, function () { grade(2); }),
            button("Good", null, function () { grade(3); }),
            button("Easy", null, function () { grade(4); })
        ]);
    }
}

function questionButtons() {
    setButtons([button("Show answer", null, reveal)]);
}

function grade(ease) {
    setButtons([]);
    AnkiBridge.grade(ease);
}

function showAnswerSide() {
    revealed = true;
    freezeClock();
    el("question").style.display = "none";
    el("answer").style.display = "block";
    el("content").scrollTop = 0;
    updateTools();
    lock();
}

function reveal() {
    if (revealed) {
        return;
    }
    AnkiBridge.reveal();
    showAnswerSide();
    gradeButtons();
}

/* called by the game after Back on the answer side; the clock resumes where it stopped */
function showQuestion(elapsedMs) {
    revealed = false;
    el("answer").style.display = "none";
    el("question").style.display = "block";
    el("content").scrollTop = 0;
    note("");
    runClock(elapsedMs);
    questionButtons();
    updateTools();
    lock();
}

/* called by the game when the thinking time runs out */
function timeUp() {
    if (revealed) {
        return;
    }
    timedOut = true;
    showAnswerSide();
    var title = el("title");
    title.className = "bad";
    title.textContent = "Time's up!";
    setButtons([button("Continue", "counts as Again", function () { grade(1); })]);
}

/* called by the game when a bury/suspend had no other card to switch to */
function noOtherCards() {
    note("No other cards are due right now.");
    if (revealed) {
        gradeButtons();
    } else {
        questionButtons();
    }
    updateTools();
}

function busy() {
    setButtons([]);
    ["btn-back", "btn-bury", "btn-suspend"].forEach(function (id) { el(id).disabled = true; });
}

(function init() {
    el("title").textContent = CONFIG.title;

    // AnkiDroid's media folder isn't reachable from here
    Array.prototype.forEach.call(document.querySelectorAll("img"), function (img) {
        img.addEventListener("error", function () {
            var span = document.createElement("span");
            span.className = "missing-media";
            span.textContent = "[image]";
            img.replaceWith(span);
        });
    });

    el("btn-back").addEventListener("click", function () {
        if (isLocked() || this.disabled) {
            return;
        }
        if (revealed) {
            AnkiBridge.back();
        } else {
            busy();
            AnkiBridge.undoSkip();
        }
    });
    el("btn-bury").addEventListener("click", function () {
        if (isLocked() || this.disabled) {
            return;
        }
        busy();
        AnkiBridge.skip("bury");
    });
    el("btn-suspend").addEventListener("click", function () {
        if (isLocked() || this.disabled) {
            return;
        }
        busy();
        AnkiBridge.skip("suspend");
    });

    requestAnimationFrame(function () {
        runClock(CONFIG.startElapsedMs || 0);
    });
    questionButtons();
    updateTools();
    lock();
})();
</script>
</body>
</html>
