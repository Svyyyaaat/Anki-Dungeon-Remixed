<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
@font-face {
    font-family: "GamePixel";
    src: url("_cram/fonts/pixel_font.ttf");
}

:root {
    --stone: #3e4039;
    --stone-dark: #2b2c27;
    --stone-light: #7b8073;
    --ink: #f0ece0;
    --muted: #a0a695;
    --title: #ffff44;
    --good: #7fd36a;
    --bad: #e05a4a;
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

#overlay {
    box-sizing: border-box;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
}

/* the game's window chrome, scaled 3x without smoothing */
#panel {
    box-sizing: border-box;
    width: 100%;
    max-width: 720px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    border-style: solid;
    border-width: 18px;
    border-image: url("_cram/frame.png") 6 fill / 18px stretch;
    image-rendering: pixelated;
    font-family: "GamePixel", monospace;
}

#head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: -6px 0 8px;
}

#title {
    color: var(--title);
    font-size: 20px;
    white-space: nowrap;
}

#title.bad {
    color: var(--bad);
}

#clock {
    flex: 1;
    height: 10px;
    background: var(--stone-dark);
    border: 3px solid var(--stone-light);
    image-rendering: pixelated;
}

#clock-fill {
    height: 100%;
    width: 100%;
    background: var(--good);
}

/* back / bury / suspend: kept away from the answer buttons on purpose */
#tools {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}

#new-card {
    display: none;
    margin: -2px 0 8px;
    font-size: 14px;
    color: var(--title);
    text-align: center;
}

#content {
    flex: 1 1 auto;
    overflow-y: auto;
    min-height: 60px;
    padding: 12px 10px;
    background: var(--stone-dark);
    border: 3px solid #1d1e1a;
    font-family: sans-serif;
}

#answer {
    display: none;
}

#note {
    display: none;
    margin-top: 8px;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
}

#foot {
    margin-top: 10px;
}

#buttons {
    display: flex;
    gap: 8px;
}

/* the game's red button chrome (Chrome.Type.RED_BUTTON) */
.btn {
    flex: 1;
    min-height: 48px;
    padding: 6px 4px;
    color: var(--ink);
    font-family: "GamePixel", monospace;
    font-size: 18px;
    background: none;
    border-style: solid;
    border-width: 6px;
    border-image: url("_cram/button.png") 2 fill / 6px stretch;
    image-rendering: pixelated;
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
    transition: opacity 0.15s;
}

/* the game's grey button chrome (Chrome.Type.GREY_BUTTON) */
.btn.grey {
    min-height: 36px;
    font-size: 15px;
    border-image: url("_cram/button_grey.png") 2 fill / 6px stretch;
}

.btn:active {
    filter: brightness(1.3);
}

.btn small {
    display: block;
    font-size: 12px;
    color: #ffd9c8;
}

/* not usable right now (wrong side, nothing to undo, ...) */
.btn:disabled {
    opacity: 0.35;
    filter: grayscale(1);
}

/* briefly locked after the card changes, against accidental taps */
.locked .btn {
    opacity: 0.45;
    pointer-events: none;
}

#honesty {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
}

.missing-media {
    color: var(--muted);
    font-size: 12px;
}

/* [sound:...] from the card: tap to replay */
button.snd {
    display: inline-block;
    min-width: 36px;
    min-height: 30px;
    margin: 2px 4px;
    padding: 0 6px;
    color: var(--ink);
    font-size: 14px;
    background: none;
    border-style: solid;
    border-width: 6px;
    border-image: url("_cram/button_grey.png") 2 fill / 6px stretch;
    image-rendering: pixelated;
    vertical-align: middle;
}

button.snd:active {
    filter: brightness(1.3);
}

#media-note {
    display: none;
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
}
</style>
<style>
%%CSS%%
</style>
<style>
/* keep the deck's fonts and layout, but sit on the game's dark panel */
.card {
    background: transparent !important;
    color: var(--ink) !important;
}

/* card images and media scale down to the panel, never past it */
#content img, #content video {
    max-width: 100% !important;
    max-height: 40vh !important;
    width: auto !important;
    height: auto !important;
    object-fit: contain;
}

#content svg, #content canvas, #content iframe {
    max-width: 100% !important;
}

#content table, #content pre {
    max-width: 100%;
    overflow-x: auto;
}

#content {
    overflow-wrap: anywhere;
}

/* kanji drawing: a square pad on the game's dark stone, the strokes in ink */
#draw {
    display: none;
    margin-top: 8px;
}

/* the pad spans the panel; its stroke buttons sit on it */
#pad {
    position: relative;
    box-sizing: border-box;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #f3ead2;
    border: 3px solid #1d1e1a;
    touch-action: none;
}

#pad-svg {
    width: 100%;
    height: 100%;
    display: block;
}

#pad .pad-btn svg {
    width: 24px;
    height: 24px;
    flex: 0 0 auto;
}

#pad .guide {
    stroke: #c9bc9a;
    stroke-width: 0.6;
    stroke-dasharray: 2 2;
    fill: none;
}

#pad .ink, #pad .ref {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

#pad .ink {
    stroke: #241c10;
    stroke-width: 4.5;
}

#pad .ink.ok {
    stroke: #3f8f35;
}

#pad .ink.bad {
    stroke: #c0392b;
}

#pad .ref {
    stroke: rgba(36, 28, 16, 0.18);
    stroke-width: 6;
}

#pad .pad-btn {
    position: absolute;
    min-width: 44px;
    min-height: 44px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    /* ink on paper, like the strokes, rather than the game's stone buttons */
    color: #241c10;
    background: rgba(255, 250, 235, 0.85);
    border: 2px solid #241c10;
    border-image: none;
    text-shadow: none;
}

#btn-undo { top: 6px; right: 56px; }
#btn-redo { top: 6px; right: 6px; }
#btn-clear { bottom: 6px; right: 6px; }

#pad .pad-btn:disabled {
    opacity: 0.25;
}

#result {
    display: none;
    margin-top: 6px;
    font-size: 16px;
    text-align: center;
}

#result.good {
    color: var(--good);
}

#result.bad {
    color: var(--bad);
}
</style>
</head>
<body class="card nightMode night_mode">
<div id="overlay">
    <div id="panel">
        <div id="head">
            <span id="title"></span>
            <div id="clock"><div id="clock-fill"></div></div>
        </div>
        <div id="tools">
            <button class="btn grey" id="btn-back" data-t="back">Back</button>
            <button class="btn grey" id="btn-bury" data-t="bury">Bury</button>
            <button class="btn grey" id="btn-suspend" data-t="suspend">Suspend</button>
        </div>
        <div id="new-card" data-t="new_card">New card &mdash; no penalty if you miss it</div>
        <div id="content">
            <div id="question" class="card">%%QUESTION%%</div>
            <div id="answer" class="card"></div>
            <!-- like Anki, only one side is in the page at a time: card scripts look up their own ids -->
            <template id="answer-tpl">%%ANSWER%%</template>
        </div>
        <div id="draw">
            <div id="pad">
                <svg id="pad-svg" viewBox="0 0 109 109" xmlns="http://www.w3.org/2000/svg">
                    <path class="guide" d="M54.5,0V109M0,54.5H109"/>
                    <g id="ref"></g>
                    <g id="ink"></g>
                </svg>
                <button class="btn grey pad-btn" id="btn-undo"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7H4V2"/><path d="M4 7c2.2-2.6 5-4 8.5-4A8.5 8.5 0 1 1 5 15.5"/></svg></button>
                <button class="btn grey pad-btn" id="btn-redo"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7h5V2"/><path d="M20 7c-2.2-2.6-5-4-8.5-4A8.5 8.5 0 1 0 19 15.5"/></svg></button>
                <button class="btn grey pad-btn" id="btn-clear"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
            </div>
        </div>
        <div id="result"></div>
        <div id="note"></div>
        <div id="media-note"></div>
        <div id="foot">
            <div id="buttons"></div>
            <div id="honesty" data-t="honesty">Thou shalt answer honestly &mdash; or else just play the normal game.</div>
        </div>
    </div>
</div>
<script>
var CONFIG = %%CONFIG%%;

// how long buttons ignore taps after the card changes
var LOCK_MS = 600;
// after Check the tap was deliberate: just enough to catch a double tap
var CHECK_LOCK_MS = 200;

var revealed = false;
var timedOut = false;
var lockTimer = null;

function el(id) { return document.getElementById(id); }

// the game's translation of a card-screen string, English as the fallback
function T(key, english) {
    var text = CONFIG.text && CONFIG.text[key];
    return text ? text : english;
}

function lock(ms) {
    var panel = el("panel");
    panel.classList.add("locked");
    clearTimeout(lockTimer);
    lockTimer = setTimeout(function () { panel.classList.remove("locked"); }, ms || LOCK_MS);
}

function isLocked() {
    return el("panel").classList.contains("locked");
}

function button(label, sub, onClick) {
    var b = document.createElement("button");
    b.className = "btn";
    b.textContent = label;
    if (sub) {
        var s = document.createElement("small");
        s.textContent = sub;
        b.appendChild(s);
    }
    b.addEventListener("click", function () {
        if (!isLocked()) {
            onClick();
        }
    });
    return b;
}

var shownButtons = [];   // the last real set of buttons, to bring back after a busy spell

function setButtons(list) {
    if (list.length) {
        shownButtons = list;
    }
    var box = el("buttons");
    box.innerHTML = "";
    list.forEach(function (b) { box.appendChild(b); });
}

function updateTools() {
    // back: answer side -> question; question side -> undo the last bury/suspend
    el("btn-back").disabled = timedOut || (!revealed && !CONFIG.canUndo);
    el("btn-bury").disabled = timedOut;
    el("btn-suspend").disabled = timedOut;
}

function note(text) {
    var n = el("note");
    n.textContent = text || "";
    n.style.display = text ? "block" : "none";
}

/* clock: drains from (limit - elapsed) to 0 */
function runClock(elapsedMs) {
    var fill = el("clock-fill");
    var left = Math.max(0, CONFIG.thinkMs - elapsedMs);
    var frac = left / CONFIG.thinkMs;
    fill.style.transition = "none";
    fill.style.width = (frac * 100) + "%";
    fill.style.backgroundColor = frac > 0.5 ? "#7fd36a" : "#e0a84a";
    fill.offsetWidth; // apply the start state before animating
    fill.style.transition = "width " + left + "ms linear, background-color " + left + "ms linear";
    fill.style.width = "0%";
    fill.style.backgroundColor = "#e05a4a";
}

function freezeClock() {
    var fill = el("clock-fill");
    var w = getComputedStyle(fill).width;
    var c = getComputedStyle(fill).backgroundColor;
    fill.style.transition = "none";
    fill.style.width = w;
    fill.style.backgroundColor = c;
}

function gradeButtons() {
    if (CONFIG.simple) {
        setButtons([
            button(T("again", "Again"), T("again_sub", "I missed it"), function () { grade(1); }),
            button(T("good", "Good"), T("good_sub", "I knew it"), function () { grade(3); })
        ]);
    } else {
        setButtons([
            button(T("again", "Again"), null, function () { grade(1); }),
            button(T("hard", "Hard"), null, function () { grade(2); }),
            button(T("good", "Good"), null, function () { grade(3); }),
            button(T("easy", "Easy"), null, function () { grade(4); })
        ]);
    }
}

function questionButtons() {
    if (DRAW) {
        drawQuestionButtons();
    } else {
        setButtons([button(T("show_answer", "Show answer"), null, reveal)]);
    }
}

/* card audio inside an element, in order: {f: file} for [sound:], {t, l, r} for TTS */
function clip(b) {
    if (b.hasAttribute("data-snd")) {
        return {f: b.getAttribute("data-snd")};
    }
    return {t: b.getAttribute("data-tts"), l: b.getAttribute("data-lang"), r: parseFloat(b.getAttribute("data-rate")) || 1};
}

function soundsIn(id) {
    return Array.prototype.map.call(el(id).querySelectorAll("button.snd"), clip);
}

/* ---- the two sides: only the one showing is in the page, so card scripts find their own elements ---- */

var questionNodes = null;   // the question side while the answer shows
var answerNodes = null;     // the answer side, kept after its first showing
var questionSounds = [];

/* sound buttons and missing images inside a freshly shown side */
function wire(root) {
    Array.prototype.forEach.call(root.querySelectorAll("img"), function (img) {
        img.addEventListener("error", function () {
            var span = document.createElement("span");
            span.className = "missing-media";
            span.textContent = T("image_missing", "[image missing]");
            img.replaceWith(span);
        });
    });
    Array.prototype.forEach.call(root.querySelectorAll("button.snd"), function (b) {
        b.addEventListener("click", function (e) {
            e.stopPropagation();
            play([clip(b)]);
        });
    });
}

function detach(box) {
    var frag = document.createDocumentFragment();
    while (box.firstChild) {
        frag.appendChild(box.firstChild);
    }
    return frag;
}

/* scripts parsed inside a <template> are inert: recreate them so they run, in order */
function runScripts(root) {
    Array.prototype.forEach.call(root.querySelectorAll("script"), function (old) {
        var s = document.createElement("script");
        Array.prototype.forEach.call(old.attributes, function (a) { s.setAttribute(a.name, a.value); });
        s.text = old.text;
        old.replaceWith(s);
    });
}

function swapToAnswer() {
    var q = el("question"), a = el("answer");
    if (!questionNodes) {
        questionNodes = detach(q);
    }
    if (answerNodes) {
        a.appendChild(answerNodes);
        answerNodes = null;
    } else if (!a.firstChild) {
        a.appendChild(el("answer-tpl").content.cloneNode(true));
        wire(a);
        runScripts(a);
    }
    q.style.display = "none";
    a.style.display = "block";
}

function swapToQuestion() {
    var q = el("question"), a = el("answer");
    answerNodes = detach(a);
    if (questionNodes) {
        q.appendChild(questionNodes);
        questionNodes = null;
    }
    a.style.display = "none";
    q.style.display = "block";
}

function play(clips) {
    if (clips.length) {
        AnkiBridge.play(JSON.stringify(clips));
    }
}

/* the answer usually repeats the question ({{FrontSide}}); autoplay only what's new */
function answerOnlySounds() {
    var asked = questionSounds.map(function (c) { return JSON.stringify(c); });
    return soundsIn("answer").filter(function (c) { return asked.indexOf(JSON.stringify(c)) < 0; });
}

function grade(ease) {
    setButtons([]);
    AnkiBridge.grade(ease);
}

function showAnswerSide() {
    revealed = true;
    freezeClock();
    swapToAnswer();
    el("content").scrollTop = 0;
    updateTools();
    lock();
}

function reveal() {
    if (revealed) {
        return;
    }
    AnkiBridge.reveal();
    showAnswerSide();
    gradeButtons();
    play(answerOnlySounds());
}

/* called by the game after Back on the answer side; the clock resumes where it stopped */
function showQuestion(elapsedMs) {
    revealed = false;
    AnkiBridge.stopAudio();
    swapToQuestion();
    el("content").scrollTop = 0;
    note("");
    if (DRAW) {
        checked = false;
        verdict = null;
        el("ref").innerHTML = "";
        el("result").style.display = "none";
        renderInk();
    }
    runClock(elapsedMs);
    questionButtons();
    updateTools();
    lock();
}

/* called by the game when the thinking time runs out */
function timeUp() {
    if (revealed) {
        return;
    }
    timedOut = true;
    showAnswerSide();
    if (DRAW) {
        checked = true;
        showReference();
        renderInk();
    }
    var title = el("title");
    title.className = "bad";
    title.textContent = T("times_up", "Time's up!");
    play(answerOnlySounds());
    setButtons([button(T("continue", "Continue"), T("continue_sub", "counts as Again"), function () { grade(1); })]);
}

/* called by the game when a bury/suspend had no other card to switch to */
function noOtherCards() {
    note(T("no_other", "No other cards are due right now."));
    setButtons(shownButtons);
    updateTools();
}

function busy() {
    setButtons([]);
    ["btn-back", "btn-bury", "btn-suspend"].forEach(function (id) { el(id).disabled = true; });
}


/* ---- kanji drawing (CONFIG.draw: {strokes: [svg path, ...]} in KanjiVG's 109-unit box) ---- */

var DRAW = CONFIG.draw || null;
var SAMPLES = 24;
// how far a stroke may stray, in units of the 109-unit box (generous: fingers are not brushes)
var MAX_MEAN_DIST = 16;
var MAX_END_DIST = 26;

var strokes = [];     // finished strokes: arrays of {x, y}
var redoStack = [];
var current = null;   // the stroke being drawn
var checked = false;
var verdict = null;   // {correct, mistakes, perStroke}

function svgEl(name, attrs) {
    var e = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (var k in attrs) {
        e.setAttribute(k, attrs[k]);
    }
    return e;
}

function padPoint(ev) {
    var svg = el("pad-svg");
    var pt = svg.createSVGPoint();
    pt.x = ev.clientX;
    pt.y = ev.clientY;
    var p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return {x: p.x, y: p.y};
}

function pointsAttr(pts) {
    return pts.map(function (p) { return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
}

/* after checking, the pad stays open for practice: the first change drops the right/wrong colours */
function edited() {
    if (checked && verdict && verdict.perStroke) {
        verdict = {correct: verdict.correct, mistakes: verdict.mistakes, perStroke: null};
    }
}

function renderInk() {
    var g = el("ink");
    g.innerHTML = "";
    strokes.forEach(function (s, i) {
        var cls = "ink";
        if (verdict && verdict.perStroke) {
            cls += verdict.perStroke[i] ? " ok" : " bad";
        }
        g.appendChild(svgEl("polyline", {"class": cls, points: pointsAttr(s.length > 1 ? s : [s[0], s[0]])}));
    });
    if (current) {
        g.appendChild(svgEl("polyline", {"class": "ink", points: pointsAttr(current)}));
    }
    el("btn-undo").disabled = strokes.length === 0;
    el("btn-redo").disabled = redoStack.length === 0;
    el("btn-clear").disabled = strokes.length === 0;
}

function showReference() {
    var g = el("ref");
    g.innerHTML = "";
    DRAW.strokes.forEach(function (d) {
        g.appendChild(svgEl("path", {"class": "ref", d: d}));
    });
}

function startPad() {
    var pad = el("pad");
    pad.addEventListener("pointerdown", function (ev) {
        if (ev.target.closest && ev.target.closest("button")) {
            return;
        }
        if (revealed && !checked) {
            return;
        }
        ev.preventDefault();
        edited();
        pad.setPointerCapture(ev.pointerId);
        current = [padPoint(ev)];
        renderInk();
    });
    pad.addEventListener("pointermove", function (ev) {
        if (!current) {
            return;
        }
        ev.preventDefault();
        var p = padPoint(ev);
        var last = current[current.length - 1];
        if (Math.abs(p.x - last.x) + Math.abs(p.y - last.y) > 0.8) {
            current.push(p);
            renderInk();
        }
    });
    function end() {
        if (!current) {
            return;
        }
        strokes.push(current);
        current = null;
        redoStack = [];
        renderInk();
    }
    pad.addEventListener("pointerup", end);
    pad.addEventListener("pointercancel", end);

    el("btn-undo").addEventListener("click", function () {
        if (strokes.length) {
            edited();
            redoStack.push(strokes.pop());
            renderInk();
        }
    });
    el("btn-redo").addEventListener("click", function () {
        if (redoStack.length) {
            edited();
            strokes.push(redoStack.pop());
            renderInk();
        }
    });
    el("btn-clear").addEventListener("click", function () {
        if (strokes.length) {
            edited();
            // one undo brings the whole drawing back, stroke by stroke
            for (var i = strokes.length - 1; i >= 0; i--) {
                redoStack.push(strokes[i]);
            }
            strokes = [];
            renderInk();
        }
    });
    renderInk();
}

/* points evenly spaced along a polyline */
function resample(pts, n) {
    if (pts.length === 1) {
        var one = [];
        for (var k = 0; k < n; k++) {
            one.push(pts[0]);
        }
        return one;
    }
    var lens = [0];
    for (var i = 1; i < pts.length; i++) {
        lens.push(lens[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
    }
    var total = lens[lens.length - 1] || 1;
    var out = [];
    var j = 1;
    for (var s = 0; s < n; s++) {
        var t = total * s / (n - 1);
        while (j < pts.length - 1 && lens[j] < t) {
            j++;
        }
        var seg = lens[j] - lens[j - 1] || 1;
        var f = Math.min(1, Math.max(0, (t - lens[j - 1]) / seg));
        out.push({x: pts[j - 1].x + (pts[j].x - pts[j - 1].x) * f, y: pts[j - 1].y + (pts[j].y - pts[j - 1].y) * f});
    }
    return out;
}

/* the reference strokes as point lists, measured by the browser's own SVG geometry */
function referencePoints() {
    var svg = el("pad-svg");
    return DRAW.strokes.map(function (d) {
        var path = svgEl("path", {d: d});
        svg.appendChild(path);
        var len = path.getTotalLength();
        var pts = [];
        for (var i = 0; i < SAMPLES; i++) {
            var p = path.getPointAtLength(len * i / (SAMPLES - 1));
            pts.push({x: p.x, y: p.y});
        }
        svg.removeChild(path);
        return pts;
    });
}

function bounds(lists) {
    var b = {x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity};
    lists.forEach(function (pts) {
        pts.forEach(function (p) {
            b.x0 = Math.min(b.x0, p.x); b.y0 = Math.min(b.y0, p.y);
            b.x1 = Math.max(b.x1, p.x); b.y1 = Math.max(b.y1, p.y);
        });
    });
    return b;
}

function meanDist(a, b) {
    var sum = 0;
    for (var i = 0; i < a.length; i++) {
        sum += Math.hypot(a[i].x - b[i].x, a[i].y - b[i].y);
    }
    return sum / a.length;
}

/*
 * Stroke by stroke, in order: the drawing is moved and scaled onto the reference
 * (so size and position on the pad don't matter), then each stroke must follow
 * its reference closely enough, start and end near its ends, and run the right way.
 */
function judge() {
    var ref = referencePoints();
    if (!strokes.length) {
        return {correct: false, mistakes: ref.length, perStroke: []};
    }
    var rb = bounds(ref);
    var ub = bounds(strokes);
    var rs = Math.max(rb.x1 - rb.x0, rb.y1 - rb.y0) || 1;
    var us = Math.max(ub.x1 - ub.x0, ub.y1 - ub.y0) || 1;
    var scale = Math.min(3, Math.max(0.33, rs / us));
    var rcx = (rb.x0 + rb.x1) / 2, rcy = (rb.y0 + rb.y1) / 2;
    var ucx = (ub.x0 + ub.x1) / 2, ucy = (ub.y0 + ub.y1) / 2;

    var perStroke = [];
    var mistakes = Math.abs(strokes.length - ref.length);
    strokes.forEach(function (s, i) {
        if (i >= ref.length) {
            perStroke.push(false);
            return;
        }
        var u = resample(s.map(function (p) {
            return {x: rcx + (p.x - ucx) * scale, y: rcy + (p.y - ucy) * scale};
        }), SAMPLES);
        var r = ref[i];
        var d = meanDist(u, r);
        var reversed = meanDist(u, r.slice().reverse());
        var startD = Math.hypot(u[0].x - r[0].x, u[0].y - r[0].y);
        var endD = Math.hypot(u[SAMPLES - 1].x - r[SAMPLES - 1].x, u[SAMPLES - 1].y - r[SAMPLES - 1].y);
        var ok = d <= MAX_MEAN_DIST && startD <= MAX_END_DIST && endD <= MAX_END_DIST && d <= reversed + 2;
        perStroke.push(ok);
        if (!ok) {
            mistakes++;
        }
    });
    return {correct: mistakes === 0, mistakes: mistakes, perStroke: perStroke};
}

function showResult(text, good) {
    var r = el("result");
    r.textContent = text;
    r.className = good ? "good" : "bad";
    r.style.display = "block";
}

function correctButtons() {
    if (CONFIG.simple) {
        setButtons([button(T("continue", "Continue"), T("counts_good", "counts as Good"), function () { grade(3); })]);
    } else {
        setButtons([
            button(T("hard", "Hard"), null, function () { grade(2); }),
            button(T("good", "Good"), null, function () { grade(3); }),
            button(T("easy", "Easy"), null, function () { grade(4); })
        ]);
    }
}

function check() {
    if (revealed) {
        return;
    }
    checked = true;
    verdict = judge();
    AnkiBridge.reveal();
    revealed = true;
    freezeClock();
    showReference();
    renderInk();
    swapToAnswer();
    el("content").scrollTop = 0;
    updateTools();
    lock(CHECK_LOCK_MS);
    play(answerOnlySounds());
    if (verdict.correct) {
        showResult(T("draw_correct", "Correct!"), true);
        correctButtons();
    } else {
        showResult(T("draw_wrong", "Not quite") + (strokes.length !== DRAW.strokes.length
                ? " (" + strokes.length + " / " + DRAW.strokes.length + ")" : ""), false);
        setButtons([
            button(T("continue", "Continue"), T("continue_sub", "counts as Again"), function () { grade(1); }),
            button(T("disagree", "Disagree"), T("disagree_sub", "count it correct"), function () {
                verdict = {correct: true, perStroke: null};
                renderInk();
                showResult(T("draw_accepted", "Counted as correct"), true);
                correctButtons();
                lock(CHECK_LOCK_MS);
            })
        ]);
    }
}

function drawQuestionButtons() {
    setButtons([button(T("check", "Check"), null, check)]);
}

(function init() {
    el("title").textContent = CONFIG.title;
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (node) {
        node.textContent = T(node.getAttribute("data-t"), node.textContent);
    });

    wire(el("question"));
    questionSounds = soundsIn("question");

    if (CONFIG.newCard) {
        el("new-card").style.display = "block";
    }

    if (DRAW) {
        el("draw").style.display = "flex";
        startPad();
    }

    if (CONFIG.missingMedia > 0) {
        var mn = el("media-note");
        mn.textContent = T("media_missing",
            "Some pictures or sounds are missing. Add them in Settings > Flashcards > Pictures & sounds.");
        mn.style.display = "block";
    }

    el("btn-back").addEventListener("click", function () {
        if (isLocked() || this.disabled) {
            return;
        }
        if (revealed) {
            AnkiBridge.back();
        } else {
            busy();
            AnkiBridge.undoSkip();
        }
    });
    el("btn-bury").addEventListener("click", function () {
        if (isLocked() || this.disabled) {
            return;
        }
        busy();
        AnkiBridge.skip("bury");
    });
    el("btn-suspend").addEventListener("click", function () {
        if (isLocked() || this.disabled) {
            return;
        }
        busy();
        AnkiBridge.skip("suspend");
    });

    requestAnimationFrame(function () {
        runClock(CONFIG.startElapsedMs || 0);
    });
    questionButtons();
    updateTools();
    lock();
    play(questionSounds);
})();
</script>
</body>
</html>
