cram.kanji.words_add_title=Колода для письма кандзи
cram.kanji.words_add_text=Добавить колоду «Cram Dungeon Kanji – Writing» в AnkiDroid? 2136 кандзи, по одной карточке для письма на каждый, в порядке школьных классов. Это обычная колода Anki: Anki планирует её повторения и синхронизирует её.
