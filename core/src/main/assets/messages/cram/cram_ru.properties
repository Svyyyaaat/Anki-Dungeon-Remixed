cram.kanji.title=Письмо кандзи
cram.kanji.choose_text=Тренировать написание кандзи, рисуя их на карточках для письма?\n\n_Учить кандзи:_ впервые сталкиваетесь с кандзи? Учите их по методу Heisig с бесплатной колодой All in One Kanji: ключевое слово и история, а кандзи пишете вы.\n\n_Чтение без письма:_ умеете читать, но не писать? Колода повседневных слов, в каждом из которых пропущен один кандзи — его пишете вы.
cram.kanji.heisig_get_title=Скачать колоду кандзи
cram.kanji.heisig_get_text=Используется бесплатная колода _All in One Kanji Deck (Heisig's RTK Order, 6th edition)_ с AnkiWeb. Скачайте её, откройте файл в AnkiDroid и снова выберите здесь _Учить кандзи_.
cram.kanji.open_ankiweb=Открыть AnkiWeb
cram.kanji.heisig_found_title=All in One Kanji
cram.kanji.heisig_found_text=Найдена колода «%s». Приостановить её карточки на узнавание, чтобы попадались только карточки для письма? Вы можете в любой момент возобновить их в обозревателе карточек AnkiDroid.
