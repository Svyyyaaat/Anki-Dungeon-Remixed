cram.kanji.title=Пісьмо кандзі
cram.kanji.choose_text=Трэніраваць напісанне кандзі, малюючы іх на картках для пісьма?\n\n_Вучыць кандзі:_ толькі знаёміцеся з кандзі? Вучыце іх па метадзе Heisig з бясплатнай калодай All in One Kanji: ключавое слова і гісторыя, а кандзі пішаце вы.\n\n_Чытанне без пісьма:_ умееце чытаць, але не пісаць? Калода штодзённых слоў, у кожным з якіх прапушчаны адзін кандзі — яго пішаце вы.
cram.kanji.heisig_get_title=Спампаваць калоду кандзі
cram.kanji.heisig_get_text=Выкарыстоўваецца бясплатная калода _All in One Kanji Deck (Heisig's RTK Order, 6th edition)_ з AnkiWeb. Спампуйце яе, адкрыйце файл у AnkiDroid і зноў выберыце тут _Вучыць кандзі_.
cram.kanji.open_ankiweb=Адкрыць AnkiWeb
cram.kanji.heisig_found_title=All in One Kanji
cram.kanji.heisig_found_text=Знойдзена калода «%s». Прыпыніць яе карткі на пазнаванне, каб трапляліся толькі карткі для пісьма? Вы можаце ў любы момант аднавіць іх у аглядальніку картак AnkiDroid.
