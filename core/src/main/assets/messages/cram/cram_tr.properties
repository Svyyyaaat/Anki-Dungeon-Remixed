cram.kanji.title=Kanji yazma
cram.kanji.choose_text=Kanjileri yazma kartlarında çizerek yazmayı çalışmak ister misin?\n\n_Kanji öğrenmek:_ kanjiye yeni mi başlıyorsun? Ücretsiz All in One Kanji destesiyle Heisig usulü öğren: bir anahtar kelime ve bir hikâye, kanjiyi de sen yazarsın.\n\n_Okumak, yazmak değil:_ okuyabiliyor ama yazamıyor musun? Her birinde bir kanjinin boş bırakıldığı günlük kelimelerden oluşan bir deste; o kanjiyi sen yazarsın.
