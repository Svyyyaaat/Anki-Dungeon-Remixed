cram.kanji.title=Skribado de kanĝioj
cram.kanji.choose_text=Ekzerci la skribadon de kanĝioj desegnante ilin sur la skribkartoj?\n\n_Lerni kanĝiojn:_ nova pri kanĝioj? Lernu ilin laŭ Heisig per la senpaga kartaro All in One Kanji: ŝlosilvorto kaj rakonto, kaj vi skribas la kanĝion.\n\n_Legi, ne skribi:_ vi scipovas legi sed ne skribi? Kartaro de ĉiutagaj vortoj kun unu kaŝita kanĝio, por ke vi skribu ĝin.
cram.kanji.heisig_get_title=Akiri la kanĝian kartaron
cram.kanji.heisig_get_text=Ĉi tio uzas la senpagan kartaron _All in One Kanji Deck (Heisig's RTK Order, 6th edition)_ de AnkiWeb. Elŝutu ĝin, malfermu la dosieron per AnkiDroid, poste elektu denove _Lerni kanĝiojn_ ĉi tie.
