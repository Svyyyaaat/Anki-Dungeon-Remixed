cram.kanji.choose_text=Procvičovat psaní kanji kreslením na kartičkách na psaní?\n\n_Učení kanji:_ s kanji začínáš? Uč se je Heisigovou metodou s bezplatným balíčkem All in One Kanji: klíčové slovo a příběh, a ty napíšeš kanji.\n\n_Čtení, ne psaní:_ umíš číst, ale ne psát? Balíček běžných slov s jedním vynechaným kanji, které napíšeš.
