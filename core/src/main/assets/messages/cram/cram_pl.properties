cram.kanji.words_add_text=Dodać talię „Cram Dungeon Kanji – Writing” do AnkiDroid? 2136 kanji, po jednej fiszce do pisania, w kolejności klas szkolnych. To zwykła talia Anki: Anki planuje powtórki i ją synchronizuje.
