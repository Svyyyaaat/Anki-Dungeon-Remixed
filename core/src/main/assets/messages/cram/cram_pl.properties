cram.kanji.heisig_found_title=All in One Kanji
cram.kanji.heisig_found_text=Znaleziono „%s”. Zawiesić jej fiszki rozpoznawania, żeby pojawiały się tylko fiszki do pisania? Możesz je w każdej chwili odwiesić w przeglądarce kart AnkiDroid.
