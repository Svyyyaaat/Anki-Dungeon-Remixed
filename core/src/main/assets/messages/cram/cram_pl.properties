cram.kanji.title=Pisanie kanji
cram.kanji.choose_text=Ćwiczyć pisanie kanji, rysując je na fiszkach do pisania?\n\n_Nauka kanji:_ dopiero zaczynasz z kanji? Ucz się ich metodą Heisiga z darmową talią All in One Kanji: słowo klucz i historyjka, a ty piszesz kanji.\n\n_Czytanie, nie pisanie:_ umiesz czytać, ale nie pisać? Talia codziennych słów z jednym ukrytym kanji, które masz napisać.
cram.kanji.heisig_get_title=Pobierz talię kanji
cram.kanji.heisig_get_text=Używana jest darmowa talia _All in One Kanji Deck (Heisig's RTK Order, 6th edition)_ z AnkiWeb. Pobierz ją, otwórz plik w AnkiDroid, a potem wybierz tu ponownie _Nauka kanji_.
