cram.unsaved.text=AnkiDroid gặp lỗi và không ghi lại được %d câu trả lời của bạn. Thẻ đã được tạm dừng để không mất thêm lượt ôn nào.\n\nHãy mở AnkiDroid để kiểm tra xem nó có hoạt động không, rồi thử lại.
