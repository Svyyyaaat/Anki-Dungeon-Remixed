cram.kanji.title=Viết kanji
cram.kanji.choose_text=Luyện viết kanji bằng cách vẽ chúng trên thẻ viết?\n\n_Học kanji:_ mới làm quen với kanji? Hãy học theo kiểu Heisig với bộ thẻ miễn phí All in One Kanji: một từ khóa và một câu chuyện, rồi bạn viết chữ kanji.\n\n_Đọc, không viết:_ bạn đọc được nhưng không viết được? Một bộ thẻ gồm các từ thông dụng, mỗi từ để trống một chữ kanji để bạn viết.
cram.kanji.heisig_get_title=Tải bộ thẻ kanji
cram.kanji.heisig_get_text=Tính năng này dùng bộ thẻ miễn phí _All in One Kanji Deck (Heisig's RTK Order, 6th edition)_ từ AnkiWeb. Hãy tải về, mở tệp bằng AnkiDroid, rồi chọn lại _Học kanji_ ở đây.
