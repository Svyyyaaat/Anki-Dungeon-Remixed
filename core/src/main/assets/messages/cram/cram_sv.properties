cram.kanji.choose_text=Öva på att skriva kanji genom att rita dem på skrivkorten?\n\n_Lära sig kanji:_ ny på kanji? Lär dig dem på Heisigs sätt med den kostnadsfria kortleken All in One Kanji: ett nyckelord och en berättelse, och du skriver tecknet.\n\n_Läsa, inte skriva:_ kan du läsa men inte skriva? En kortlek med vardagsord där ett kanji är bortplockat, som du skriver.
