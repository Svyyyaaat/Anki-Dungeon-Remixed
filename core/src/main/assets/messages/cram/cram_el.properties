cram.kanji.words_add_text=Προσθήκη της τράπουλας «Cram Dungeon Kanji – Writing» στο AnkiDroid; 2.136 κάντζι, μία κάρτα γραφής για το καθένα, με σειρά σχολικής τάξης. Είναι κανονική τράπουλα Anki: το Anki τη χρονοπρογραμματίζει και τη συγχρονίζει.
