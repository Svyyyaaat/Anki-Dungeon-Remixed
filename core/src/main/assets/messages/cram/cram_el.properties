cram.kanji.heisig_found_text=Βρέθηκε η «%s». Αναστολή των καρτών αναγνώρισής της, ώστε να εμφανίζονται μόνο οι κάρτες γραφής; Μπορείς να άρεις την αναστολή όποτε θέλεις από τον περιηγητή καρτών του AnkiDroid.
