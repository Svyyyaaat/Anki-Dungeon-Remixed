cram.kanji.choose_text=Εξάσκηση στη γραφή κάντζι σχεδιάζοντάς τα στις κάρτες γραφής;\n\n_Μαθαίνω κάντζι:_ πρώτη φορά με τα κάντζι; Μάθε τα με τη μέθοδο Heisig με τη δωρεάν τράπουλα All in One Kanji: μια λέξη-κλειδί και μια ιστορία, και γράφεις εσύ το κάντζι.\n\n_Διαβάζω, δεν γράφω:_ ξέρεις να διαβάζεις αλλά όχι να γράφεις; Μια τράπουλα με καθημερινές λέξεις όπου λείπει ένα κάντζι, για να το γράψεις εσύ.
cram.kanji.heisig_get_title=Λήψη της τράπουλας κάντζι
cram.kanji.heisig_get_text=Χρησιμοποιείται η δωρεάν τράπουλα _All in One Kanji Deck (Heisig's RTK Order, 6th edition)_ από το AnkiWeb. Κατέβασέ την, άνοιξε το αρχείο με το AnkiDroid και μετά διάλεξε ξανά εδώ το _Μαθαίνω κάντζι_.
