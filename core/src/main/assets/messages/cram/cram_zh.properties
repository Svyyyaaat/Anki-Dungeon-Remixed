cram.kanji.title=汉字书写
cram.kanji.choose_text=在书写卡片上画出汉字，练习书写吗？\n\n_学习汉字：_刚接触汉字？用免费的 All in One Kanji 牌组按 Heisig 方法学习：一个关键词和一个故事，由你写出汉字。\n\n_会读不会写：_能读但不会写？一个日常词汇牌组，每个词中留空一个汉字，由你写出来。
cram.kanji.heisig_get_title=获取汉字牌组
cram.kanji.heisig_get_text=这将使用 AnkiWeb 上的免费牌组_All in One Kanji Deck (Heisig's RTK Order, 6th edition)_。下载它，用 AnkiDroid 打开文件，然后回到这里再次选择_学习汉字_。
