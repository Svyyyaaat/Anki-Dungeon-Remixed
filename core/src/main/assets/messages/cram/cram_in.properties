cram.kanji.title=Menulis kanji
cram.kanji.choose_text=Berlatih menulis kanji dengan menggambarnya di kartu menulis?\n\n_Belajar kanji:_ baru mengenal kanji? Pelajari dengan gaya Heisig memakai dek gratis All in One Kanji: satu kata kunci dan satu cerita, lalu kamu menulis kanjinya.\n\n_Membaca, bukan menulis:_ bisa membaca tapi belum bisa menulis? Dek berisi kata sehari-hari dengan satu kanji dikosongkan, untuk kamu tulis.
cram.kanji.heisig_get_title=Dapatkan dek kanji
cram.kanji.heisig_get_text=Ini memakai dek gratis _All in One Kanji Deck (Heisig's RTK Order, 6th edition)_ dari AnkiWeb. Unduh, buka filenya dengan AnkiDroid, lalu pilih _Belajar kanji_ di sini lagi.
